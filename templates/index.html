<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Brisage - Dofus</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Barre de défilement personnalisée pour les menus déroulants */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e2538;
      border-radius: 0 8px 8px 0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-gray-100 min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Formulaire : Enregistrer un brisage -->
    <div class="bg-[#1e293b] border border-gray-800 rounded-xl p-5 shadow-lg">
      <h2 class="text-amber-400 font-bold text-lg mb-4 flex items-center gap-2">
        <span class="text-xl">+</span> Enregistrer un brisage
      </h2>

      <form id="brisage-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <!-- Pseudo -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Pseudo</label>
          <input 
            type="text" 
            id="player-name" 
            placeholder="Asudon"
            class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors"
          />
        </div>

        <!-- Nom de l'item avec Autocomplétion -->
        <div class="relative w-full" id="item-name-wrapper">
          <label class="block text-xs font-medium text-gray-400 mb-1">Nom de l'item</label>
          <div class="relative">
            <input 
              type="text" 
              id="item-name-input" 
              placeholder="Ex: Masque Ardent"
              autocomplete="off"
              class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors placeholder-gray-500"
            />
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 text-xs">▼</span>
          </div>
          <div 
            id="item-name-dropdown" 
            class="hidden absolute z-50 left-0 right-0 mt-1 max-h-60 overflow-y-auto bg-[#1e2538] border border-gray-700 rounded-lg shadow-xl divide-y divide-gray-800/50 custom-scrollbar"
          ></div>
        </div>

        <!-- Catégorie -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Catégorie</label>
          <select id="category-select" class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors">
            <option value="Chapeau">Chapeau</option>
            <option value="Cape">Cape</option>
            <option value="Amulette">Amulette</option>
            <option value="Anneau">Anneau</option>
            <option value="Bottes">Bottes</option>
            <option value="Ceinture">Ceinture</option>
            <option value="Arme">Arme</option>
            <option value="Bouclier">Bouclier</option>
          </select>
        </div>

        <!-- Type de brisage avec Autocomplétion -->
        <div class="relative w-full" id="break-type-wrapper">
          <label class="block text-xs font-medium text-gray-400 mb-1">Type de brisage</label>
          <div class="relative">
            <input 
              type="text" 
              id="break-type-input" 
              placeholder="Ex: Do So"
              autocomplete="off"
              class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors placeholder-gray-500"
            />
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 text-xs">▼</span>
          </div>
          <div 
            id="break-type-dropdown" 
            class="hidden absolute z-50 left-0 right-0 mt-1 max-h-60 overflow-y-auto bg-[#1e2538] border border-gray-700 rounded-lg shadow-xl divide-y divide-gray-800/50 custom-scrollbar"
          ></div>
        </div>

        <!-- Coût du Craft -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Coût du Craft (Kamas)</label>
          <input type="number" id="craft-cost" class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors" />
        </div>

        <!-- Coefficient -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Coefficient obtenu (%)</label>
          <input type="number" id="coeff" class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors" />
        </div>

        <!-- Valeur Runes -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Valeur Runes obtenues (Kamas)</label>
          <input type="number" id="runes-value" class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors" />
        </div>

        <!-- Bénéfice (Calculé / Lecture seule) -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Bénéfice estimé</label>
          <div class="w-full bg-[#182030] text-gray-300 font-bold text-sm rounded-lg px-3 py-2 border border-gray-800">
            <span id="estimated-benefit">0 K</span>
          </div>
        </div>

        <!-- Date -->
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Date du brisage</label>
          <input type="date" id="break-date" class="w-full bg-[#2a3447] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-amber-500 transition-colors" />
        </div>

        <!-- Bouton Enregistrer -->
        <div class="md:col-span-3 flex items-end">
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 rounded-lg transition-colors shadow-md">
            Enregistrer
          </button>
        </div>

      </form>
    </div>

  </div>

  <!-- Script JS d'autocomplétion -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      function setupAutocomplete(inputId, dropdownId, wrapperId, jsonUrl) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        const wrapper = document.getElementById(wrapperId);

        if (!input || !dropdown || !wrapper) return;

        let itemsList = [];

        fetch(jsonUrl)
          .then(res => res.json())
          .then(data => { itemsList = data; })
          .catch(err => console.error(`Erreur de chargement (${jsonUrl}):`, err));

        function renderOptions(filterText = "") {
          dropdown.innerHTML = "";
          
          const filtered = itemsList
            .filter(item => item.toLowerCase().includes(filterText.toLowerCase()))
            .slice(0, 50);

          if (filtered.length === 0) {
            dropdown.innerHTML = `<div class="px-3 py-2 text-xs text-gray-500">Aucun résultat</div>`;
            return;
          }

          filtered.forEach(itemValue => {
            const item = document.createElement("div");
            item.className = "px-3 py-2 text-sm text-gray-200 hover:bg-amber-500/20 hover:text-amber-400 cursor-pointer transition-colors";
            item.textContent = itemValue;

            item.addEventListener("click", () => {
              input.value = itemValue;
              dropdown.classList.add("hidden");
              input.dispatchEvent(new Event('change'));
            });

            dropdown.appendChild(item);
          });
        }

        input.addEventListener("focus", () => {
          renderOptions(input.value);
          dropdown.classList.remove("hidden");
        });

        input.addEventListener("input", () => {
          renderOptions(input.value);
          dropdown.classList.remove("hidden");
        });

        document.addEventListener("click", (e) => {
          if (!wrapper.contains(e.target)) {
            dropdown.classList.add("hidden");
          }
        });
      }

      // Initialisation
      setupAutocomplete("item-name-input", "item-name-dropdown", "item-name-wrapper", "/static/noms_items.json");
      setupAutocomplete("break-type-input", "break-type-dropdown", "break-type-wrapper", "/static/break_types.json");

    });
  </script>
</body>
</html>
