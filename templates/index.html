<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mafia Brisage - Saisie & Historique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e2538;
      border-radius: 0 8px 8px 0;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="bg-[#0b101d] text-gray-100 min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- En-tête centré + Navigation -->
    <div class="bg-[#171e2e] p-4 rounded-xl border border-amber-500/30 text-center space-y-3 shadow-lg">
      <h1 class="text-3xl font-bold text-amber-400">Data Mafia Brisage</h1>
      <nav class="flex justify-center gap-2">
        <a href="/" class="bg-amber-500 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition">
          📝 Saisie & Historique
        </a>
        <a href="/bilan" class="bg-[#20293a] hover:bg-gray-700 text-amber-300 font-bold px-4 py-2 rounded-lg text-sm transition border border-gray-700/60">
          📊 Bilan & Stats
        </a>
        <a href="/items" class="bg-[#20293a] hover:bg-gray-700 text-amber-300 font-bold px-4 py-2 rounded-lg text-sm transition border border-gray-700/60">
          📦 Historique par Item
        </a>
      </nav>
    </div>

    <!-- Section 1 : Formulaire "Enregistrer un brisage" -->
    <div class="bg-[#171e2e] border border-gray-800/80 rounded-xl p-5 shadow-lg">
      <h2 class="text-amber-400 font-bold text-lg mb-4 flex items-center gap-2">
        <span class="text-xl font-extrabold">+</span> Enregistrer un brisage
      </h2>

      <form id="brisage-form" class="space-y-4">
        <!-- Ligne 1 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Pseudo</label>
            <input 
              type="text" 
              id="player-name" 
              placeholder="Asudon"
              class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors"
            />
          </div>

          <div class="relative w-full" id="item-name-wrapper">
            <label class="block text-xs font-medium text-gray-400 mb-1">Nom de l'item</label>
            <div class="relative">
              <input 
                type="text" 
                id="item-name-input" 
                placeholder="Ex: Masque Ardent"
                autocomplete="off"
                class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors placeholder-gray-500"
              />
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 text-xs">▼</span>
            </div>
            <div 
              id="item-name-dropdown" 
              class="hidden absolute z-50 left-0 right-0 mt-1 max-h-60 overflow-y-auto bg-[#171e2e] border border-gray-700 rounded-lg shadow-2xl divide-y divide-gray-800/50 custom-scrollbar"
            ></div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Catégorie</label>
            <select id="category-select" class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors">
              <option value="Chapeau">Chapeau</option>
              <option value="Cape">Cape</option>
              <option value="Amulette">Amulette</option>
              <option value="Anneau">Anneau</option>
              <option value="Bottes">Bottes</option>
              <option value="Ceinture">Ceinture</option>
              <option value="Arme">Arme</option>
              <option value="Bouclier">Bouclier</option>
            </select>
          </div>

          <div class="relative w-full" id="break-type-wrapper">
            <label class="block text-xs font-medium text-gray-400 mb-1">Type de brisage</label>
            <div class="relative">
              <input 
                type="text" 
                id="break-type-input" 
                placeholder="Ex: Do So"
                autocomplete="off"
                class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors placeholder-gray-500"
              />
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 text-xs">▼</span>
            </div>
            <div 
              id="break-type-dropdown" 
              class="hidden absolute z-50 left-0 right-0 mt-1 max-h-60 overflow-y-auto bg-[#171e2e] border border-gray-700 rounded-lg shadow-2xl divide-y divide-gray-800/50 custom-scrollbar"
            ></div>
          </div>
        </div>

        <!-- Ligne 2 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Coût du Craft (Kamas)</label>
            <input type="number" id="craft-cost" class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Coefficient obtenu (%)</label>
            <input type="number" id="coeff" class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Valeur Runes obtenues (Kamas)</label>
            <input type="number" id="runes-value" class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Bénéfice estimé</label>
            <div class="w-full bg-[#111622] text-white font-bold text-sm rounded-lg px-3 py-2 border border-gray-800">
              <span id="estimated-benefit">0 K</span>
            </div>
          </div>
        </div>

        <!-- Ligne 3 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-1">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Date du brisage</label>
            <input type="date" id="break-date" class="w-full bg-[#20293a] text-white text-sm rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500 transition-colors" />
          </div>

          <div class="md:col-span-3 flex items-end">
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded-lg transition-colors shadow-md text-sm">
              Enregistrer
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Section 2 : Historique des brisages -->
    <div class="bg-[#171e2e] border border-gray-800/80 rounded-xl p-5 shadow-lg space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <h2 class="text-amber-400 font-bold text-lg">
          Historique des brisages
        </h2>

        <div class="flex flex-wrap items-center gap-2">
          <div class="relative">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Rechercher item, joueur..." 
              class="bg-[#20293a] text-xs text-white placeholder-gray-400 rounded-lg pl-8 pr-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500"
            />
            <span class="absolute left-2.5 top-2 text-gray-400 text-xs">🔍</span>
          </div>

          <select id="filter-category" class="bg-[#20293a] text-xs text-white rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500">
            <option value="all">Toutes catégories</option>
            <option value="Chapeau">Chapeau</option>
            <option value="Cape">Cape</option>
            <option value="Amulette">Amulette</option>
            <option value="Anneau">Anneau</option>
            <option value="Bottes">Bottes</option>
            <option value="Ceinture">Ceinture</option>
            <option value="Arme">Arme</option>
            <option value="Bouclier">Bouclier</option>
          </select>

          <select id="filter-date" class="bg-[#20293a] text-xs text-white rounded-lg px-3 py-2 border border-gray-700/60 focus:outline-none focus:border-amber-500">
            <option value="desc">Date (Plus récent)</option>
            <option value="asc">Date (Plus ancien)</option>
          </select>
        </div>
      </div>

      <!-- Tableau d'historique -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="text-xs text-gray-400 border-b border-gray-800">
            <tr>
              <th scope="col" class="pb-3 font-semibold">Date</th>
              <th scope="col" class="pb-3 font-semibold">Joueur</th>
              <th scope="col" class="pb-3 font-semibold">Catégorie</th>
              <th scope="col" class="pb-3 font-semibold">Item</th>
              <th scope="col" class="pb-3 font-semibold">Type</th>
              <th scope="col" class="pb-3 font-semibold">Coût Craft</th>
              <th scope="col" class="pb-3 font-semibold">Coeff</th>
              <th scope="col" class="pb-3 font-semibold">Bénéfice</th>
              <th scope="col" class="pb-3 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="history-tbody" class="divide-y divide-gray-800/60"></tbody>
        </table>
      </div>

      <!-- Barre de Pagination -->
      <div class="flex items-center justify-between border-t border-gray-800/80 pt-4 text-xs text-gray-400">
        <div id="pagination-info">Affichage de 0 à 0 sur 0 brisages</div>
        <div class="flex items-center gap-2">
          <button id="btn-prev-page" class="bg-[#20293a] hover:bg-gray-700 text-gray-300 font-semibold px-3 py-1.5 rounded-lg border border-gray-700/60 disabled:opacity-40 disabled:cursor-not-allowed transition">
            ◄ Précédent
          </button>
          <span id="page-indicator" class="font-bold text-amber-400 px-2">Page 1 / 1</span>
          <button id="btn-next-page" class="bg-[#20293a] hover:bg-gray-700 text-gray-300 font-semibold px-3 py-1.5 rounded-lg border border-gray-700/60 disabled:opacity-40 disabled:cursor-not-allowed transition">
            Suivant ►
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      // --- AUTOCOMPLÉTION ---
      function setupAutocomplete(inputId, dropdownId, wrapperId, jsonUrl) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        const wrapper = document.getElementById(wrapperId);

        if (!input || !dropdown || !wrapper) return;

        let itemsList = [];

        fetch(jsonUrl)
          .then(res => res.json())
          .then(data => { itemsList = data; })
          .catch(err => console.error(`Erreur de chargement (${jsonUrl}):`, err));

        function renderOptions(filterText = "") {
          dropdown.innerHTML = "";
          
          const filtered = itemsList
            .filter(item => item.toLowerCase().includes(filterText.toLowerCase()))
            .slice(0, 50);

          if (filtered.length === 0) {
            dropdown.innerHTML = `<div class="px-3 py-2 text-xs text-gray-500">Aucun résultat</div>`;
            return;
          }

          filtered.forEach(itemValue => {
            const item = document.createElement("div");
            item.className = "px-3 py-2 text-sm text-gray-200 hover:bg-amber-500/20 hover:text-amber-400 cursor-pointer transition-colors";
            item.textContent = itemValue;

            item.addEventListener("click", () => {
              input.value = itemValue;
              dropdown.classList.add("hidden");
              input.dispatchEvent(new Event('change'));
            });

            dropdown.appendChild(item);
          });
        }

        input.addEventListener("focus", () => {
          renderOptions(input.value);
          dropdown.classList.remove("hidden");
        });

        input.addEventListener("input", () => {
          renderOptions(input.value);
          dropdown.classList.remove("hidden");
        });

        document.addEventListener("click", (e) => {
          if (!wrapper.contains(e.target)) {
            dropdown.classList.add("hidden");
          }
        });
      }

      setupAutocomplete("item-name-input", "item-name-dropdown", "item-name-wrapper", "/static/noms_items.json");
      setupAutocomplete("break-type-input", "break-type-dropdown", "break-type-wrapper", "/static/break_types.json");


      // --- GESTION DE L'HISTORIQUE & PAGINATION (50 MAX / PAGE) ---
      let allHistoryData = [];
      let currentPage = 1;
      const itemsPerPage = 50;

      async function loadHistory() {
        try {
          const res = await fetch('/api/brisage');
          if (res.ok) {
            allHistoryData = await res.json();
            renderTable();
          }
        } catch (err) {
          console.error("Erreur lors du chargement de l'historique :", err);
        }
      }

      function getFilteredData() {
        const search = document.getElementById("search-input").value.toLowerCase();
        const cat = document.getElementById("filter-category").value;
        const sortDate = document.getElementById("filter-date").value;

        let filtered = allHistoryData.filter(item => {
          const matchSearch = (item.item_name && item.item_name.toLowerCase().includes(search)) ||
                              (item.pseudo && item.pseudo.toLowerCase().includes(search));
          const matchCat = cat === "all" || item.category === cat;
          return matchSearch && matchCat;
        });

        filtered.sort((a, b) => {
          const dateA = new Date(a.entry_date);
          const dateB = new Date(b.entry_date);
          return sortDate === "desc" ? dateB - dateA : dateA - dateB;
        });

        return filtered;
      }

      function renderTable() {
        const tbody = document.getElementById("history-tbody");
        const filtered = getFilteredData();

        const totalItems = filtered.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = startIdx + itemsPerPage;
        const pageItems = filtered.slice(startIdx, endIdx);

        tbody.innerHTML = "";

        if (pageItems.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" class="py-6 text-center text-gray-500 italic">Aucun brisage trouvé</td></tr>`;
        } else {
          pageItems.forEach(item => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-800/30 transition-colors";

            const profit = item.kama_profit || 0;
            const profitClass = profit >= 0 ? "text-emerald-400" : "text-red-400";
            const formattedProfit = (profit >= 0 ? "+" : "") + profit.toLocaleString() + " K";

            tr.innerHTML = `
              <td class="py-3 text-xs text-gray-400">${item.entry_date || '-'}</td>
              <td class="py-3 font-medium text-white">${item.pseudo || 'Inconnu'}</td>
              <td class="py-3"><span class="bg-[#20293a] text-gray-300 text-xs px-2.5 py-1 rounded border border-gray-700/50">${item.category || '-'}</span></td>
              <td class="py-3 font-medium text-white">${item.item_name}</td>
              <td class="py-3"><span class="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-xs font-semibold px-2 py-0.5 rounded">${item.break_type || '-'}</span></td>
              <td class="py-3">${(item.craft_cost || 0).toLocaleString()} K</td>
              <td class="py-3">${item.coeff}%</td>
              <td class="py-3 font-semibold ${profitClass}">${formattedProfit}</td>
              <td class="py-3 text-right space-x-1">
                <button onclick="editEntry(${item.id})" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded transition-colors">Éditer</button>
                <button onclick="deleteEntry(${item.id})" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs font-semibold px-2.5 py-1 rounded transition-colors">Supprimer</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        // Mettre à jour les contrôles de pagination
        document.getElementById("pagination-info").textContent = 
          totalItems > 0 
            ? `Affichage de ${startIdx + 1} à ${Math.min(endIdx, totalItems)} sur ${totalItems} brisage${totalItems > 1 ? 's' : ''}`
            : "Affichage de 0 sur 0 brisages";

        document.getElementById("page-indicator").textContent = `Page ${currentPage} / ${totalPages}`;
        document.getElementById("btn-prev-page").disabled = (currentPage <= 1);
        document.getElementById("btn-next-page").disabled = (currentPage >= totalPages);
      }

      // Événements Filtres
      document.getElementById("search-input").addEventListener("input", () => { currentPage = 1; renderTable(); });
      document.getElementById("filter-category").addEventListener("change", () => { currentPage = 1; renderTable(); });
      document.getElementById("filter-date").addEventListener("change", () => { currentPage = 1; renderTable(); });

      // Événements Pagination
      document.getElementById("btn-prev-page").addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      });

      document.getElementById("btn-next-page").addEventListener("click", () => {
        currentPage++;
        renderTable();
      });

      loadHistory();
    });
  </script>
</body>
</html>
